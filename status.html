<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Lesson Planner — Status</title>
  <link rel="icon" type="image/png" href="assets/school-mark.png" />
  <style>
    :root { --ink:#1f2740; --sub:#6b7488; --line:#e4e7ef; --ok:#1f9d55; --bad:#d64545; --warn:#c47f17; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--ink); background:linear-gradient(160deg,#fdf3ea,#fbecf1 50%,#efeefb); min-height:100vh; padding:24px; }
    .wrap { max-width:640px; margin:0 auto; }
    h1 { font-size:22px; margin:4px 0 2px; }
    .muted { color:var(--sub); font-size:13px; margin:0 0 18px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:14px 0;
      box-shadow:0 1px 3px rgba(20,30,60,.05); }
    .big { font-size:18px; font-weight:700; display:flex; align-items:center; gap:10px; }
    .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
    .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.warn { background:var(--warn); }
    .row { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
    .row:first-child { border-top:none; }
    .tag { font-weight:600; }
    .tag.ok { color:var(--ok); } .tag.bad { color:var(--bad); } .tag.warn { color:var(--warn); }
    .h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); margin:0 0 6px; }
    input { padding:11px 13px; border:1px solid var(--line); border-radius:10px; font-size:15px; width:100%; }
    button { padding:11px 16px; border:none; border-radius:10px; background:#2f7d4f; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    .err { color:var(--bad); font-size:14px; }
    .errlist { font-size:13px; color:var(--sub); }
    .errlist .e { padding:7px 0; border-top:1px solid var(--line); }
    .errlist .e:first-child { border-top:none; }
    a.back { color:var(--sub); font-size:13px; text-decoration:none; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Back to the planner</a>
    <h1>Lesson Planner — Status</h1>
    <p class="muted">A private health check for the school administrator.</p>

    <form id="pwForm" class="card">
      <p class="h2">Enter the school password</p>
      <input type="password" id="pw" placeholder="School password" autocomplete="current-password" />
      <div style="margin-top:12px"><button type="submit" id="go">Check status</button></div>
      <p id="pwErr" class="err hidden">That password didn't work.</p>
    </form>

    <div id="report" class="hidden">
      <div class="card">
        <div class="big"><span id="overallDot" class="dot"></span><span id="overall"></span></div>
        <p class="muted" id="writerLine" style="margin:8px 0 0"></p>
      </div>

      <div class="card">
        <p class="h2">Set-up checklist</p>
        <div id="checklist"></div>
      </div>

      <div class="card">
        <p class="h2">Today's usage</p>
        <div class="row"><span>Plans made today</span><span class="tag" id="usage"></span></div>
        <div class="row"><span>Daily limit</span><span id="cap"></span></div>
      </div>

      <div class="card">
        <p class="h2">Recent problems (newest first)</p>
        <div id="errors" class="errlist"></div>
      </div>

      <p class="muted" id="checkedAt"></p>
      <div><button id="refresh">Refresh</button></div>
    </div>
  </div>

  <script>
    (function () {
      function el(id) { return document.getElementById(id); }
      var lastPw = "";

      function fmtTime(ms) {
        try { var d = new Date(ms); return d.toLocaleString(); } catch (e) { return ""; }
      }
      function checkRow(label, on, warnOnly) {
        var cls = on ? "ok" : (warnOnly ? "warn" : "bad");
        var word = on ? "On" : (warnOnly ? "Off (optional)" : "Missing");
        return '<div class="row"><span>' + label + '</span><span class="tag ' + cls + '">' + word + "</span></div>";
      }

      function render(d) {
        el("pwForm").classList.add("hidden");
        el("report").classList.remove("hidden");
        el("overallDot").className = "dot " + (d.healthy ? "ok" : "bad");
        el("overall").textContent = d.healthy ? "Everything looks healthy" : "There is a problem";
        el("writerLine").textContent = "Writer in use: " + d.writer;

        var c = d.config || {};
        el("checklist").innerHTML =
          checkRow("Claude (main writer)", c.claude) +
          checkRow("Gemini (backup writer)", c.gemini, true) +
          checkRow("Store (saves plans + library)", c.store) +
          checkRow("Background mode (close-and-come-back)", c.selfRunning, true) +
          checkRow("School password", c.passwordSet, true);

        var u = d.usage || {};
        el("usage").textContent = (u.today != null ? u.today : "—");
        el("usage").className = "tag " + ((u.today >= u.cap) ? "bad" : (u.today >= u.cap * 0.8 ? "warn" : "ok"));
        el("cap").textContent = (u.cap != null ? u.cap + " per day (resets after midnight IST)" : "—");

        var errs = d.recentErrors || [];
        el("errors").innerHTML = errs.length
          ? errs.map(function (e) { return '<div class="e"><strong>' + fmtTime(e.t) + "</strong> · " + esc(e.msg || "") + "</div>"; }).join("")
          : '<div class="e" style="color:#1f9d55">No problems recorded. 🎉</div>';

        el("checkedAt").textContent = "Checked " + fmtTime(d.checkedAt);
      }
      function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

      function load(pw) {
        lastPw = pw;
        return fetch("api/health?pw=" + encodeURIComponent(pw)).then(function (r) {
          if (r.status === 401) { el("pwErr").classList.remove("hidden"); return null; }
          return r.json();
        }).then(function (d) { if (d) render(d); }, function () {
          el("pwErr").textContent = "Couldn't reach the status service."; el("pwErr").classList.remove("hidden");
        });
      }

      el("pwForm").addEventListener("submit", function (e) { e.preventDefault(); el("pwErr").classList.add("hidden"); load(el("pw").value.trim()); });
      el("refresh") && el("refresh").addEventListener("click", function () { load(lastPw); });
    })();
  </script>
</body>
</html>
