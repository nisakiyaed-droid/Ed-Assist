name: Deploy to GitHub Pages

# Publishes the site so teachers get a shareable link.
# One-time setup: in the repo, go to Settings → Pages → Source → "GitHub Actions".
# After that, every push to this branch updates the live site automatically.

on:
  push:
    branches:
      - claude/product-building-consultation-bbqq58
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
